<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的软件</title>
    <style>
        /* 重置默认边距 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 40px 32px 48px;
            transition: all 0.3s ease;
        }

        /* 标题样式 */
        .page-title {
            text-align: center;
            font-size: 2.4rem;
            font-weight: 700;
            color: #1a2332;
            letter-spacing: 1px;
            margin-bottom: 32px;
            position: relative;
        }

        .page-title::after {
            content: "";
            display: block;
            width: 60px;
            height: 4px;
            background: linear-gradient(135deg, #4f8cf7, #7c6cf0);
            border-radius: 4px;
            margin: 12px auto 0;
        }

        /* 图片容器 — 图片自适应宽度 */
        .image-wrapper {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #eef1f5;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }

        .image-wrapper img {
            display: block;
            width: 100%;
            height: auto;
            /* 保证图片比例不变，且宽度填满容器 */
            object-fit: contain;
            transition: transform 0.4s ease;
        }

        .image-wrapper img:hover {
            transform: scale(1.005);
        }

        /* 图片下方小提示（可选） */
        .image-caption {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #8a94a6;
            letter-spacing: 0.3px;
        }

        /* 响应式调整：小屏幕下标题缩小，内边距减小 */
        @media (max-width: 640px) {
            .container {
                padding: 24px 16px 32px;
            }

            .page-title {
                font-size: 1.8rem;
            }

            .page-title::after {
                width: 44px;
                height: 3px;
            }
        }

        @media (max-width: 400px) {
            .page-title {
                font-size: 1.5rem;
            }

            .container {
                padding: 18px 12px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 页面标题 -->
        <h1 class="page-title">我的软件</h1>

        <!-- 图片区域：自适应页面宽度 -->
        <div class="image-wrapper">
            <!--
                请将 src 替换为你自己的图片地址。
                当前使用 picsum.photos 的随机图片作为示例，
                图片尺寸为 1200×600，确保在不同屏幕下都清晰。
            -->
            <img
            src="https://picsum.photos/seed/software/1200/600"
            alt="我的软件 - 展示图片"
            />
        </div>

        <!-- 可选：图片说明 -->
        <p class="image-caption">✨ 图片自适应页面宽度，缩放窗口试试</p>
    </div>

</body>
</html>
